name: technology footprint

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/footprint.mjs'
      - '.github/workflows/footprint.yml'

jobs:
  footprint:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build the card
        run: node .github/scripts/footprint.mjs
        env:
          FOOTPRINT_TOKEN: ${{ secrets.FOOTPRINT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.repository_owner }}
          OUT: dist

      - name: publish to the footprint branch
        run: |
          [ -f dist/footprint-dark.svg ] || exit 0
          cd dist
          git init -q -b footprint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "technology footprint"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" footprint
